<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Simple CSP: allow local scripts and styles (nodeIntegration is enabled, local use only) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="style.css">
  <title>DeskPulse</title>
</head>
<body>
  <!-- Panel container: all content lives inside .widget -->
  <div class="widget">

    <!-- Liquid glass refraction layer: flowing colored blobs give backdrop-filter something to refract -->
    <div class="liquid-blobs" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <!-- Normal mode content (full panel: date/system/battery/CPU/MEM/GPU/disk/network) -->
    <div class="normal-content">
      <!-- Row 1 (top 50px drag area): date/time + uptime (left) and OS (right) -->
      <div class="row row-top">
        <span class="datetime-group">
          <span id="datetime" class="datetime">--</span>
          <span id="uptime" class="uptime" style="display:none">--</span>
        </span>
        <span id="osname" class="osname">--</span>
      </div>

      <!-- Row 2: power (battery or desktop) -->
      <div class="row row-power">
        <span class="label">POWER</span>
        <span id="battery" class="value battery">--</span>
      </div>

      <!-- Row 3: CPU + memory -->
      <div class="row row-split">
        <div class="metric">
          <span class="label">CPU</span>
          <span id="cpu" class="value">--</span>
          <canvas id="spark-cpu" class="sparkline" width="60" height="16" style="display:none"></canvas>
          <span id="cpumodel" class="sub">--</span>
          <div id="cpucores" class="cpu-cores" style="display:none"></div>
        </div>
        <div class="metric">
          <span class="label">MEM</span>
          <span id="mem" class="value">--</span>
          <canvas id="spark-mem" class="sparkline" width="60" height="16" style="display:none"></canvas>
          <span id="memspec" class="sub" style="display:none">--</span>
        </div>
      </div>

      <!-- Row 4: GPU (static info, full-width row) -->
      <div class="row row-block" id="row-gpu">
        <span class="label">GPU</span>
        <span id="gpu" class="value">--</span>
        <span id="gpuram" class="sub" style="display:none">--</span>
      </div>

      <!-- Row 5: storage (multi-drive list, full width) -->
      <div class="row row-block" id="row-disk">
        <span class="label">DISK</span>
        <div id="disklist" class="disk-list"><div class="disk-item">--</div></div>
      </div>

      <!-- Row 6: network speed (full width) -->
      <div class="row row-net" id="row-net">
        <span class="label">NET</span>
        <span class="value">
          <span id="wifi" class="wifi" style="display:none">--</span>
          <span id="netdown">↓ --</span>
          <span id="netup">↑ --</span>
          <canvas id="spark-net" class="sparkline spark-net" width="80" height="16" style="display:none"></canvas>
        </span>
      </div>
    </div>

    <!-- Compact mode content: CPU / GPU / MEM / network in one row, for monitoring while gaming in a corner overlay -->
    <div class="compact-content">
      <div class="compact-row">
        <span class="compact-item compact-cpu">
          <span class="compact-label">CPU</span><span id="cpu-compact" class="compact-value">--</span>
        </span>
        <span class="compact-item compact-gpu">
          <span class="compact-label">GPU</span><span id="gpu-compact" class="compact-value">--</span>
        </span>
        <span class="compact-item compact-mem">
          <span class="compact-label">MEM</span><span id="mem-compact" class="compact-value">--</span>
        </span>
        <span class="compact-item compact-net">
          <span id="netdown-compact">↓ --</span>
          <span id="netup-compact">↑ --</span>
        </span>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
